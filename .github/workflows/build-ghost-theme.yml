name: Build Ghost Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build theme ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme
        run: pnpm build

      - name: Validate theme
        run: pnpm test:ci

      - name: Create Ghost theme ZIP
        run: pnpm zip

      - name: Upload Ghost theme
        uses: actions/upload-artifact@v4
        with:
          name: jeffperry-ghost-theme
          path: dist/source.zip
          if-no-files-found: error
